<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🏆 A2 Flyers 聽力與讀寫衝刺挑戰賽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 15px; background: #eef2f7; color: #333; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    .card { background: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); width: 100%; max-width: 520px; text-align: center; box-sizing: border-box; }
    .badge { background: #3498db; color: white; padding: 4px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .sub-badge { display: inline-block; background: #ecf0f1; color: #2c3e50; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin-top: 8px; font-weight: bold; }
    .q-text { font-size: 17px; margin: 16px 0; font-weight: bold; line-height: 1.5; color: #2c3e50; text-align: left; }
    .btn { background: #2ecc71; color: white; border: none; padding: 13px 20px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 6px 0; width: 100%; font-weight: bold; box-sizing: border-box; }
    .btn:hover { opacity: 0.9; }
    .btn-audio { background: #e67e22; margin-bottom: 12px; }
    .btn-skip { background: #95a5a6; margin-top: 10px; }
    .opt-btn { background: #f8f9fa; border: 2px solid #dfe4ea; padding: 12px 15px; border-radius: 12px; width: 100%; text-align: left; margin: 6px 0; cursor: pointer; font-size: 15px; box-sizing: border-box; line-height: 1.4; }
    .opt-btn:hover { background: #ffeaa7; border-color: #f1c40f; }
    .input-box { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 10px; margin-bottom: 10px; text-align: center; box-sizing: border-box; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; text-align: left; font-size: 14px; line-height: 1.5; }
    .success-box { background: #e8f8f5; border-left: 5px solid #2ecc71; color: #27ae60; }
    .error-box { background: #fdf2f2; border-left: 5px solid #e74c3c; color: #c0392b; }
    .score-big { font-size: 38px; color: #2ecc71; font-weight: bold; margin: 15px 0; }
    .error-item { text-align: left; background: #fff5f5; padding: 12px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #e74c3c; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
<div class="card">
  <span class="badge" id="type-badge">A2 FLYERS</span><br>
  <span class="sub-badge" id="part-badge">準備就緒</span>
  <div id="quiz-area" style="min-height: 180px; display: flex; flex-direction: column; justify-content: center; margin-top:10px;">
    <h3 style="color:#2c3e50; margin-bottom:15px;">🏆 官方考綱衝刺測驗</h3>
    <p style="color:#7f8c8d; font-size:14px; margin-bottom:20px; line-height: 1.5;">
      涵蓋聽力 Part 1-5 與讀寫 Part 1-7。<br>
      隨機抽取 15 題不重複練習，遇錯題或跳過自動循環複習！
    </p>
    <button class="btn" id="start-btn" style="background:#3498db; padding:15px;">✨ 開始挑戰 🚀</button>
  </div>
  <div id="feedback-area" class="result-box"></div>
  <button class="btn" id="next-btn" style="display:none; background:#34495e; margin-top:15px;">下一題 ➡️</button>
</div>

<script>
  (function() {
    // ⚠️ 記得確保此處是你在 Google Apps Script 部署取得的最新網址
    var GAS_URL = "https://script.google.com/macros/s/你的AppsScriptID/exec";

    // 依據劍橋 A2 Flyers 官方大綱建立的題庫池
    var masterPool = [
      // === 聽力測驗 (Listening) ===
      // Part 1: 人物特徵連線
      {part:"Listening Part 1", type:"listening", audio:"Look at the girl carrying a heavy backpack and running towards the school bus. That is Helen.", q:"Who is Helen?", o:["The girl carrying a backpack", "The girl on the bicycle", "The girl reading under the tree"], a:"The girl carrying a backpack", e:"聽力提到 Helen 正在背著大書包跑向校車。"},
      {part:"Listening Part 1", type:"listening", audio:"Do you see the man with the black moustache fixing his silver car? His name is William.", q:"Which person is William?", o:["The man washing his bike", "The man fixing his car", "The man wearing sunglasses"], a:"The man fixing his car", e:"關鍵特徵為 fixing his silver car。"},
      // Part 2: 填充（單字/數字/時間）
      {part:"Listening Part 2", type:"listening_fill", audio:"The school trip to the science museum is on Friday. The bus will leave at eight thirty in the morning.", q:"School Trip to Museum:<br>• Day: Friday<br>• Departure time: _______", o:[], a:"8:30", e:"聽力明確提及 leave at eight thirty (8:30)。"},
      {part:"Listening Part 2", type:"listening_fill", audio:"David joined the sports club last week. His favorite activity is volleyball.", q:"David's Information:<br>• Favorite sport: _______", o:[], a:"volleyball", e:"聽力提到 His favorite activity is volleyball。"},
      // Part 3: 配對題
      {part:"Listening Part 3", type:"listening", audio:"Emma bought presents for her family yesterday. She bought an umbrella for her grandmother because it rains often.", q:"What present did Emma buy for her grandmother?", o:["An umbrella", "A silver ring", "A warm scarf"], a:"An umbrella", e:"Emma 給祖母買了雨傘（umbrella）。"},
      {part:"Listening Part 3", type:"listening", audio:"Where did George leave his football boots? He didn't leave them in his bedroom, he left them in the basement.", q:"Where are George's football boots?", o:["In the garden", "In his bedroom", "In the basement"], a:"In the basement", e:"關鍵在於否定了臥室，最後放在 basement（地下室）。"},
      // Part 4: 勾選情境單選
      {part:"Listening Part 4", type:"listening", audio:"What did Oliver eat for lunch today? He wanted pizza, but there was only pasta and vegetable salad left.", q:"What did Oliver eat for lunch?", o:["Pizza and fries", "Pasta and salad", "Sandwiches and soup"], a:"Pasta and salad", e:"雖然想吃披薩，但最後只有 pasta and vegetable salad。"},
      {part:"Listening Part 4", type:"listening", audio:"Which film does Katy want to watch tonight? Not the dinosaur film, she prefers the comedy about monkeys.", q:"Which film does Katy choose?", o:["A film about dinosaurs", "A comedy about monkeys", "A scary mystery film"], a:"A comedy about monkeys", e:"Katy 選擇了關於猴子的喜劇（comedy about monkeys）。"},
      // Part 5: 著色與拼寫提示
      {part:"Listening Part 5", type:"listening_fill", audio:"Look at the picture of the airport. Please find the largest suitcase and write the word FLY on it.", q:"Listening Task: What word should you write on the largest suitcase?", o:[], a:"fly", e:"聽力指示在最大的行李箱上寫下 FLY。"},

      // === 閱讀與寫作 (Reading & Writing) ===
      // Part 1: 字彙與定義配對
      {part:"Reading Part 1", type:"reading_choice", q:"This person travels into space in a rocket or spaceship.", o:["An astronaut", "A pilot", "An engineer"], a:"An astronaut", e:"搭乘火箭進入太空的職業是 astronaut（太空人）。"},
      {part:"Reading Part 1", type:"reading_choice", q:"You use this soft object to rest your head on when you are sleeping in bed.", o:["A blanket", "A pillow", "A towel"], a:"A pillow", e:"睡覺時墊在頭下面的是 pillow（枕頭）。"},
      {part:"Reading Part 1", type:"reading_choice", q:"This is a place where old objects and famous paintings are kept and shown to people.", o:["A factory", "A stadium", "A museum"], a:"A museum", e:"收藏展示歷史文物與藝術品的地方是 museum（博物館）。"},
      // Part 2: 連續會話情境應答
      {part:"Reading Part 2", type:"reading_choice", q:"Sarah: 'Shall we go to the sports centre after school?'<br>Tom: '_______'", o:["Yes, good idea! I need to practice tennis.", "No, I haven't been there yesterday.", "I am twelve years old."], a:"Yes, good idea! I need to practice tennis.", e:"對於提議 'Shall we...' 最自然的回應是同意並給予理由。"},
      {part:"Reading Part 2", type:"reading_choice", q:"Teacher: 'Have you finished your history project yet?'<br>Student: '_______'", o:["Yes, I put it on your desk this morning.", "I don't like playing chess.", "It starts at three o'clock."], a:"Yes, I put it on your desk this morning.", e:"回答現在完成式的提問，明確說明已繳交。"},
      // Part 3: 圖文短文選詞
      {part:"Reading Part 3", type:"reading_choice", q:"Last weekend was snowy. The children put on their warm coats and decided to build a big snowman in the ______.", o:["garden", "cupboard", "ceiling"], a:"garden", e:"在雪天堆雪人是在花園（garden）。"},
      // Part 4: 克漏字（文法與介系詞）
      {part:"Reading Part 4", type:"reading_choice", q:"Whales are the largest creatures in the sea. They can swim very fast ______ they have powerful tails.", o:["because", "although", "so"], a:"because", e:"後句是能夠游得快的「原因」，填連詞 because。"},
      {part:"Reading Part 4", type:"reading_choice", q:"Look at that dark cloud! I think it ______ rain very soon.", o:["is going to", "goes", "rained"], a:"is going to", e:"有明確跡象（烏雲）預示即將發生的天氣，使用 is going to。"},
      // Part 5: 故事短文填空（需簡短填字）
      {part:"Reading Part 5", type:"reading_fill", q:"Read the text and fill in the missing word:<br><i>'Robert lost his keys yesterday. He searched his jacket and school bag, but he could not find them anywhere.'</i><br>Question: What was Robert looking for?", o:[], a:"keys", e:"短文第一句明確提到 Robert lost his keys。"},
      {part:"Reading Part 5", type:"reading_fill", q:"Read the text:<br><i>'Grandma baked twelve delicious chocolate cookies. Jack ate two and his sister ate three.'</i><br>Question: How many cookies did the children eat in total?", o:[], a:"5", e:"Jack 吃了 2 塊，妹妹吃了 3 塊，共 5 塊 (2+3=5)。"},
      // Part 6: 圖式/情境問答（完成句子）
      {part:"Reading Part 6", type:"reading_fill", q:"Complete the sentence:<br>A baby dog is called a puppy, and a baby cat is called a _______.", o:[], a:"kitten", e:"幼貓的專有名詞是 kitten。"},
      // Part 7: 句意/看圖寫作填空
      {part:"Reading Part 7", type:"reading_fill", q:"Write the missing preposition:<br>Yesterday afternoon, Emma was waiting _______ the bus at the station for twenty minutes.", o:[], a:"for", e:"等待某人或某物固定搭配介系詞 wait for。"}
    ];

    var queue = [];
    var currentItem = null;
    var totalQuizCount = 15;
    var answeredCorrectCount = 0;
    var allWrongsLog = [];

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
      }
      return arr;
    }

    document.getElementById("start-btn").addEventListener("click", function() {
      stopAudio();
      // 從總題庫中隨機挑選 15 題
      var shuffledPool = shuffle(JSON.parse(JSON.stringify(masterPool)));
      queue = shuffledPool.slice(0, totalQuizCount);
      answeredCorrectCount = 0;
      allWrongsLog = [];
      nextQuestion();
    });

    document.getElementById("next-btn").addEventListener("click", function() {
      stopAudio();
      nextQuestion();
    });

    function nextQuestion() {
      if (queue.length === 0) {
        showReport();
        return;
      }
      currentItem = queue.shift();
      renderCard(currentItem);
    }

    function renderCard(item) {
      stopAudio();
      var progressText = "進度：" + (answeredCorrectCount + 1) + " / " + totalQuizCount;
      if (item.isRetry) progressText += " (錯題重練)";
      document.getElementById("type-badge").innerText = progressText;
      document.getElementById("part-badge").innerText = item.part;
      document.getElementById("feedback-area").style.display = "none";
      document.getElementById("next-btn").style.display = "none";
      
      var area = document.getElementById("quiz-area");
      area.innerHTML = "";

      // 1. 聽力選擇題 (Listening Multiple Choice)
      if (item.type === "listening") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerHTML = item.q;
        area.appendChild(p);

        var ab = document.createElement("button");
        ab.className = "btn btn-audio";
        ab.innerText = "🔊 播放對話語音 (Listen)";
        ab.onclick = function() {
          stopAudio();
          var u = new SpeechSynthesisUtterance(item.audio);
          u.lang = 'en-US';
          u.rate = 0.78;
          window.speechSynthesis.speak(u);
        };
        area.appendChild(ab);

        var box = document.createElement("div");
        for (var i = 0; i < item.o.length; i++) {
          (function(txt) {
            var b = document.createElement("button");
            b.className = "opt-btn";
            b.innerText = txt;
            b.onclick = function() { checkAns(txt, txt.toLowerCase() === item.a.toLowerCase(), false); };
            box.appendChild(b);
          })(item.o[i]);
        }
        area.appendChild(box);
      }
      // 2. 聽力填空題 (Listening Fill-in)
      else if (item.type === "listening_fill") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerHTML = item.q;
        area.appendChild(p);

        var ab = document.createElement("button");
        ab.className = "btn btn-audio";
        ab.innerText = "🔊 播放對話語音 (Listen)";
        ab.onclick = function() {
          stopAudio();
          var u = new SpeechSynthesisUtterance(item.audio);
          u.lang = 'en-US';
          u.rate = 0.78;
          window.speechSynthesis.speak(u);
        };
        area.appendChild(ab);

        var ip = document.createElement("input");
        ip.type = "text";
        ip.id = "user-ip";
        ip.className = "input-box";
        ip.placeholder = "請輸入聽到的答案...";
        ip.autocomplete = "off";
        area.appendChild(ip);

        var cb = document.createElement("button");
        cb.className = "btn";
        cb.innerText = "確認答案 (Check)";
        cb.onclick = function() {
          var val = document.getElementById("user-ip").value.trim();
          checkAns(val, val.toLowerCase() === item.a.toLowerCase(), false);
        };
        area.appendChild(cb);
      }
      // 3. 閱讀選擇題 (Reading Multiple Choice)
      else if (item.type === "reading_choice") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerHTML = item.q;
        area.appendChild(p);

        var box = document.createElement("div");
        for (var i = 0; i < item.o.length; i++) {
          (function(txt) {
            var b = document.createElement("button");
            b.className = "opt-btn";
            b.innerText = txt;
            b.onclick = function() { checkAns(txt, txt.toLowerCase() === item.a.toLowerCase(), false); };
            box.appendChild(b);
          })(item.o[i]);
        }
        area.appendChild(box);
      }
      // 4. 閱讀填充題 (Reading Fill-in)
      else if (item.type === "reading_fill") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerHTML = item.q;
        area.appendChild(p);

        var ip = document.createElement("input");
        ip.type = "text";
        ip.id = "user-ip";
        ip.className = "input-box";
        ip.placeholder = "請輸入單字或答案...";
        ip.autocomplete = "off";
        area.appendChild(ip);

        var cb = document.createElement("button");
        cb.className = "btn";
        cb.innerText = "確認答案 (Check)";
        cb.onclick = function() {
          var val = document.getElementById("user-ip").value.trim();
          checkAns(val, val.toLowerCase() === item.a.toLowerCase(), false);
        };
        area.appendChild(cb);
      }

      // 共通跳過按鈕
      var skipBtn = document.createElement("button");
      skipBtn.className = "btn btn-skip";
      skipBtn.innerText = "⏭️ 不會寫，跳過 (看正確答案)";
      skipBtn.onclick = function() {
        checkAns("（學生選擇跳過）", false, true);
      };
      area.appendChild(skipBtn);
    }

    function checkAns(userAns, isPassed, isSkip) {
      stopAudio();
      var box = document.getElementById("feedback-area");
      box.style.display = "block";

      var btns = document.getElementById("quiz-area").getElementsByTagName("button");
      for (var i = 0; i < btns.length; i++) { btns[i].disabled = true; }

      if (isPassed) {
        box.className = "result-box success-box";
        box.innerHTML = "<strong>⭕ 答對了！太棒了！</strong><br>解析：" + currentItem.e;
        answeredCorrectCount++;
      } else {
        box.className = "result-box error-box";
        var head = isSkip ? "<strong>⏭️ 已跳過！請記下正確答案：</strong>" : "<strong>❌ 答錯囉！本題稍後會重新考一次：</strong>";
        box.innerHTML = head + "<br>正確答案：<b>" + currentItem.a + "</b><br>解析：" + currentItem.e;

        // 放入重試隊列末尾
        currentItem.isRetry = true;
        queue.push(currentItem);

        allWrongsLog.push({
          part: currentItem.part,
          q: currentItem.q.replace(/<[^>]*>?/gm, ''),
          u: userAns,
          a: currentItem.a,
          e: currentItem.e
        });

        // 寫入 Google 試算表 (包含 9 欄)
        sendRowToSheet(
          answeredCorrectCount,
          totalQuizCount,
          currentItem.part,
          currentItem.q.replace(/<[^>]*>?/gm, ''),
          userAns,
          currentItem.a,
          currentItem.e
        );
      }

      document.getElementById("next-btn").style.display = "block";
    }

    function sendRowToSheet(score, total, part, question, userAns, correctAns, explain) {
      if (!GAS_URL || GAS_URL.indexOf("你的AppsScriptID") !== -1) return;

      var formData = new URLSearchParams();
      formData.append("score", score);
      formData.append("total", total);
      formData.append("num", answeredCorrectCount + 1);
      formData.append("type", part);
      formData.append("question", question);
      formData.append("userAns", userAns);
      formData.append("correctAns", correctAns);
      formData.append("explain", explain);

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      }).catch(function(err) {
        console.error("同步至試算表失敗:", err);
      });
    }

    function showReport() {
      stopAudio();
      document.getElementById("type-badge").innerText = "📊 挑戰完成";
      document.getElementById("part-badge").style.display = "none";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("feedback-area").style.display = "none";

      var html = '<h3 style="color:#2c3e50; margin-bottom:5px;">🎉 恭喜完成所有大綱題型掌握！</h3>';
      html += '<div class="score-big">100%</div>';
      
      if (allWrongsLog.length === 0) {
        html += '<p style="color:#27ae60; font-weight:bold;">🏆 初次作答全部正確，實力非常堅強！</p>';
      } else {
        html += '<h4 style="text-align:left; color:#c0392b; margin-top:15px;">📋 錯題與跳過紀錄（已寫入試算表）：</h4>';
        for (var i = 0; i < allWrongsLog.length; i++) {
          var w = allWrongsLog[i];
          html += '<div class="error-item">';
          html += '<strong>[' + w.part + ']</strong> ' + w.q + '<br>';
          html += '作答：<span style="color:#c0392b;">' + w.u + '</span><br>';
          html += '正解：<span style="color:#27ae60;">' + w.a + '</span><br>';
          html += '解析：' + w.e;
          html += '</div>';
        }
      }

      html += '<button class="btn" style="background:#3498db; margin-top:15px;" onclick="location.reload();">🔄 重新挑戰新的一輪</button>';
      document.getElementById("quiz-area").innerHTML = html;
    }
  })();
</script>
</body>
</html>
