<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>🏆 A2 Flyers 隨機衝刺挑戰賽</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; padding: 15px; background: #eef2f7; color: #333; display: flex; justify-content: center; align-items: center; min-height: 90vh; margin: 0; }
    .card { background: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.06); width: 100%; max-width: 500px; text-align: center; box-sizing: border-box; }
    .badge { background: #3498db; color: white; padding: 4px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; }
    .q-text { font-size: 18px; margin: 16px 0; font-weight: bold; line-height: 1.4; color: #2c3e50; }
    .btn { background: #2ecc71; color: white; border: none; padding: 13px 20px; border-radius: 25px; cursor: pointer; font-size: 16px; margin: 6px 0; width: 100%; font-weight: bold; box-sizing: border-box; }
    .btn:hover { opacity: 0.9; }
    .btn-audio { background: #e67e22; }
    .btn-mic { background: #e74c3c; }
    .btn-skip { background: #95a5a6; margin-top: 12px; }
    .opt-btn { background: #f8f9fa; border: 2px solid #dfe4ea; padding: 13px; border-radius: 12px; width: 100%; text-align: left; margin: 6px 0; cursor: pointer; font-size: 15px; box-sizing: border-box; }
    .opt-btn:hover { background: #ffeaa7; }
    .input-box { width: 100%; padding: 12px; font-size: 17px; border: 2px solid #ccc; border-radius: 10px; margin-bottom: 10px; text-align: center; box-sizing: border-box; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; text-align: left; font-size: 15px; line-height: 1.5; }
    .success-box { background: #e8f8f5; border-left: 5px solid #2ecc71; color: #27ae60; }
    .error-box { background: #fdf2f2; border-left: 5px solid #e74c3c; color: #c0392b; }
    .score-big { font-size: 38px; color: #2ecc71; font-weight: bold; margin: 15px 0; }
    .error-item { text-align: left; background: #fff5f5; padding: 12px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #e74c3c; font-size: 14px; line-height: 1.5; }
    .sync-note { font-size: 12px; color: #7f8c8d; margin-top: 6px; }
  </style>
</head>
<body>
<div class="card">
  <span class="badge" id="type-badge">FLYERS MOCK</span>
  <div id="quiz-area" style="min-height: 180px; display: flex; flex-direction: column; justify-content: center;">
    <h3 style="color:#2c3e50; margin-bottom:20px;">🏆 A2 Flyers 衝刺挑戰賽</h3>
    <p style="color:#7f8c8d; font-size:15px; margin-bottom:25px;">共 15 題，若答錯或跳過會自動循環出題，直到全部掌握為止！</p>
    <button class="btn" id="start-btn" style="background:#3498db; padding:16px;">✨ 點擊開始挑戰 🚀</button>
  </div>
  <div id="feedback-area" class="result-box"></div>
  <button class="btn" id="next-btn" style="display:none; background:#34495e; margin-top:15px;">下一題 ➡️</button>
</div>

<script>
  (function() {
    // ⚠️ 請替換為你重新部署後的 Google Apps Script 網址
    var GAS_URL = "https://script.google.com/macros/s/AKfycby4OJml0pHntGYmXHIE-Or87DWJhvJTE6vAMY1Vucqv_JDx2OYbFsQfxpHPdd07P1XpLw/exec";

    var originalPool = [
      {id:1, t:"listening", q:"Where is the cinema? It is opposite the big train station, next to the library.", o:["Opposite the park", "Opposite the train station", "Behind the school"], a:"Opposite the train station", e:"聽力提到在火車站對面（opposite the big train station）。"},
      {id:2, t:"listening", q:"What did Mary buy at the shop? She went to look at the comics, but she only bought a beautiful postcard.", o:["A comic book", "A beautiful postcard", "A bottle of water"], a:"A beautiful postcard", e:"雖然 Mary 有去看漫畫，但她最後只有買（only bought）一張明信片。"},
      {id:3, t:"listening", q:"What time does the football match start? It usually starts at three, but today it will begin at four thirty.", o:["3:00", "4:00", "4:30"], a:"4:30", e:"時間陷阱！關鍵在於後半句提到 today it will begin at 4:30。"},
      {id:4, t:"listening", q:"Who is David? He is the boy wearing a green sweater and carrying a guitar.", o:["The boy with a guitar", "The boy playing football", "The boy reading a book"], a:"The boy with a guitar", e:"David 的特徵是拿著吉他（carrying a guitar）。"},
      {id:5, t:"listening", q:"What did the children do at the beach yesterday? It was windy, so they flew their kites all afternoon.", o:["They went swimming", "They flew kites", "They played volleyball"], a:"They flew kites", e:"孩子們因為風大（windy），所以整個下午都在放風箏（flew their kites）。"},
      {id:6, t:"reading", q:"This person flies planes to different countries around the world.", o:[], a:"pilot", e:"開飛機的職業在英文中是 pilot（飛行員）。"},
      {id:7, t:"reading", q:"Complete the sentence: My brother is _____ than me, so he can reach the top shelf.", o:[], a:"taller", e:"後面有比較級關鍵字 than，空格填 taller。"},
      {id:8, t:"reading", q:"You go to see this person when you have a terrible toothache.", o:[], a:"dentist", e:"牙齒痛時要去看 dentist（牙醫）。"},
      {id:9, t:"reading", q:"Complete the sentence: Look! The birds _____ beautifully in the garden right now.", o:[], a:"are singing", e:"看到 right now，主詞 birds 是複數，用現在進行式 are singing。"},
      {id:10, t:"reading", q:"This is a large animal that lives in the desert and can walk for days without water.", o:[], a:"camel", e:"沙漠中不需要喝水也能走好幾天的動物是 camel（駱駝）。"},
      {id:11, t:"speaking", q:"Look at the picture. Find the differences. (In Pic A, the monkey is eating a banana. In Pic B, the monkey is climbing a tree.)", o:["monkey", "banana", "climb", "tree"], a:"The monkey is climbing a tree / eating a banana.", e:"回答中提到猴子(monkey)、香蕉(banana)或爬樹(climb/tree)皆可！", img:"https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format&fit=crop&w=400&q=80"},
      {id:12, t:"speaking", q:"Look at the picture. What are the differences? (In Pic A, the weather is sunny. In Pic B, it is raining heavily.)", o:["weather", "sunny", "rain", "cloud"], a:"In Pic A it is sunny, but in Pic B it is raining.", e:"描述出晴天（sunny）或下雨（rain）的天氣對比即可！", img:"https://images.unsplash.com/photo-1514632595-4944383f2737?auto=format&fit=crop&w=400&q=80"},
      {id:13, t:"speaking", q:"Look at the pictures. Find the differences. (In Pic A, there are three boys playing. In Pic B, there are two girls playing.)", o:["boys", "girls", "playing", "three"], a:"In Pic A there are three boys, in Pic B there are two girls.", e:"重點在數量（three/two）及性別（boys/girls）。", img:"https://images.unsplash.com/photo-1485546246426-74dc88dec4d9?auto=format&fit=crop&w=400&q=80"},
      {id:14, t:"speaking", q:"Look at the pictures. What is different? (In Pic A, the dog is sleeping under the table. In Pic B, the cat is sleeping on the sofa.)", o:["dog", "cat", "table", "sofa"], a:"Pic A has a dog under the table, Pic B has a cat on the sofa.", e:"重點在動物（dog/cat）與其所在位置（table/sofa）。", img:"https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?auto=format&fit=crop&w=400&q=80"},
      {id:15, t:"speaking", q:"Look at the pictures. Find the difference. (In Pic A, the girl is wearing a red hat. In Pic B, she is not wearing a hat.)", o:["hat", "wearing", "red", "girl"], a:"In Pic A she wears a red hat, but in Pic B she does not.", e:"關鍵字是 hat (帽子) 或 wearing (穿戴)。", img:"https://images.unsplash.com/photo-1521119989659-a83eee488004?auto=format&fit=crop&w=400&q=80"}
    ];

    var queue = [];
    var currentItem = null;
    var totalBaseCount = 0;
    var answeredCorrectCount = 0;
    var allWrongsLog = [];

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = arr[i]; arr[i] = arr[j]; arr[j] = temp;
      }
      return arr;
    }

    document.getElementById("start-btn").addEventListener("click", function() {
      stopAudio();
      queue = shuffle(JSON.parse(JSON.stringify(originalPool)));
      totalBaseCount = queue.length;
      answeredCorrectCount = 0;
      allWrongsLog = [];
      nextQuestion();
    });

    document.getElementById("next-btn").addEventListener("click", function() {
      stopAudio();
      nextQuestion();
    });

    function nextQuestion() {
      if (queue.length === 0) {
        showReport();
        return;
      }
      currentItem = queue.shift();
      renderCard(currentItem);
    }

    function renderCard(item) {
      stopAudio();
      var badgeText = "進度：" + (answeredCorrectCount + 1) + " / " + totalBaseCount + " [" + item.t.toUpperCase() + "]";
      if (item.isRetry) {
        badgeText += " (複習題)";
      }
      document.getElementById("type-badge").innerText = badgeText;
      document.getElementById("feedback-area").style.display = "none";
      document.getElementById("next-btn").style.display = "none";
      
      var area = document.getElementById("quiz-area");
      area.innerHTML = "";

      // 1. 聽力題
      if (item.t === "listening") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerText = "Listen and choose the right answer.";
        area.appendChild(p);

        var ab = document.createElement("button");
        ab.className = "btn btn-audio";
        ab.innerText = "🔊 點我聽題目 (Listen)";
        ab.onclick = function() {
          stopAudio();
          var u = new SpeechSynthesisUtterance(item.q);
          u.lang = 'en-US';
          u.rate = 0.75;
          window.speechSynthesis.speak(u);
        };
        area.appendChild(ab);

        var box = document.createElement("div");
        box.style.marginTop = "10px";
        for (var i = 0; i < item.o.length; i++) {
          (function(txt) {
            var b = document.createElement("button");
            b.className = "opt-btn";
            b.innerText = txt;
            b.onclick = function() {
              checkAns(txt, txt.toLowerCase() === item.a.toLowerCase(), false);
            };
            box.appendChild(b);
          })(item.o[i]);
        }
        area.appendChild(box);
      } 
      // 2. 讀寫題
      else if (item.t === "reading") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerText = item.q;
        area.appendChild(p);

        var ip = document.createElement("input");
        ip.type = "text";
        ip.id = "user-ip";
        ip.className = "input-box";
        ip.placeholder = "請輸入答案...";
        ip.autocomplete = "off";
        area.appendChild(ip);

        var cb = document.createElement("button");
        cb.className = "btn";
        cb.innerText = "檢查答案 (Check)";
        cb.onclick = function() {
          var val = document.getElementById("user-ip").value.trim();
          checkAns(val, val.toLowerCase() === item.a.toLowerCase(), false);
        };
        area.appendChild(cb);
      } 
      // 3. 口說題
      else if (item.t === "speaking") {
        var p = document.createElement("p");
        p.className = "q-text";
        p.innerText = "Look and find the differences.";
        area.appendChild(p);

        if (item.img) {
          var img = document.createElement("img");
          img.src = item.img;
          img.style.maxWidth = "100%";
          img.style.maxHeight = "160px";
          img.style.borderRadius = "10px";
          img.style.margin = "0 auto 10px auto";
          img.style.display = "block";
          area.appendChild(img);
        }

        var mb = document.createElement("button");
        mb.className = "btn btn-mic";
        mb.innerText = "🎙️ 開始錄音答題";
        mb.onclick = function() {
          var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) { alert("此瀏覽器不支援語音辨識，請使用 Chrome。"); return; }
          var rec = new SR();
          rec.lang = 'en-US';
          rec.onstart = function() { mb.innerText = "🛑 正在聽你說話..."; };
          rec.onresult = function(e) {
            var text = e.results[0][0].transcript;
            mb.innerText = "🎙️ 開始錄音答題";
            var isMatched = item.o.some(function(k) { return text.toLowerCase().includes(k.toLowerCase()); });
            checkAns(text, isMatched, false);
          };
          rec.onerror = function() { mb.innerText = "🎙️ 開始錄音答題"; alert("錄音未成功，請確認麥克風權限或改按跳過。"); };
          rec.start();
        };
        area.appendChild(mb);
      }

      // 所有題型下方均加入「跳過按鈕」
      var skipBtn = document.createElement("button");
      skipBtn.className = "btn btn-skip";
      skipBtn.innerText = "⏭️ 不會寫，跳過看答案";
      skipBtn.onclick = function() {
        checkAns("（學生選擇跳過）", false, true);
      };
      area.appendChild(skipBtn);
    }

    function checkAns(userAns, isPassed, isSkip) {
      stopAudio(); // 答題立刻停止上一題的朗讀
      var box = document.getElementById("feedback-area");
      box.style.display = "block";

      // 鎖定按鈕避免連點
      var btns = document.getElementById("quiz-area").getElementsByTagName("button");
      for (var i = 0; i < btns.length; i++) { btns[i].disabled = true; }

      if (isPassed) {
        box.className = "result-box success-box";
        box.innerHTML = "<strong>⭕ 答對了！太棒了！</strong><br>解釋：" + currentItem.e;
        answeredCorrectCount++;
      } else {
        box.className = "result-box error-box";
        var headText = isSkip ? "<strong>⏭️ 已跳過本題！請記下正確答案：</strong>" : "<strong>❌ 答錯囉！這題稍後會重新出現：</strong>";
        box.innerHTML = headText + "<br>正確答案是：<b>" + currentItem.a + "</b><br>解釋：" + currentItem.e;

        // 核心機制：答錯或跳過，重新塞回隊列尾端
        currentItem.isRetry = true;
        queue.push(currentItem);

        // 記錄並即時寫入試算表
        allWrongsLog.push({
          num: currentItem.id,
          t: currentItem.t.toUpperCase(),
          q: currentItem.q,
          u: userAns,
          a: currentItem.a,
          e: currentItem.e
        });

        sendRowToSheet(currentItem.id, currentItem.t.toUpperCase(), currentItem.q, userAns, currentItem.a, currentItem.e);
      }

      document.getElementById("next-btn").style.display = "block";
    }

    // 發送單題紀錄至 Google Apps Script
    function sendRowToSheet(num, type, question, userAns, correctAns, explain) {
      if (!GAS_URL || GAS_URL.indexOf("你的AppsScriptID") !== -1) return;

      var formData = new URLSearchParams();
      formData.append("score", answeredCorrectCount);
      formData.append("total", totalBaseCount);
      formData.append("num", num);
      formData.append("type", type);
      formData.append("question", question);
      formData.append("userAns", userAns);
      formData.append("correctAns", correctAns);
      formData.append("explain", explain);

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        body: formData
      }).catch(function(err) {
        console.error("同步至試算表失敗:", err);
      });
    }

    function showReport() {
      stopAudio();
      document.getElementById("type-badge").innerText = "📊 挑戰成功";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("feedback-area").style.display = "none";

      var html = '<h3 style="color:#2c3e50; margin-bottom:5px;">🎉 恭喜全部題目皆已掌握！</h3>';
      html += '<div class="score-big">100%</div>';
      
      if (allWrongsLog.length === 0) {
        html += '<p style="color:#27ae60; font-weight:bold;">🏆 初次作答全部答對，太厲害了！</p>';
      } else {
        html += '<h4 style="text-align:left; color:#c0392b; margin-top:15px;">📋 錯題與跳過歷程（已同步至試算表）：</h4>';
        for (var i = 0; i < allWrongsLog.length; i++) {
          var w = allWrongsLog[i];
          html += '<div class="error-item">';
          html += '<strong>第 ' + w.num + ' 題 [' + w.t + ']</strong><br>';
          html += '題目：' + w.q + '<br>';
          html += '當時作答：<span style="color:#c0392b;">' + w.u + '</span><br>';
          html += '正確答案：<span style="color:#27ae60;">' + w.a + '</span><br>';
          html += '解析：' + w.e;
          html += '</div>';
        }
      }

      html += '<button class="btn" style="background:#3498db; margin-top:15px;" onclick="location.reload();">🔄 重新挑戰</button>';
      document.getElementById("quiz-area").innerHTML = html;
    }
  })();
</script>
</body>
</html>
